function progress(){
  const rows=PEOPLE.map(p=>{
    const keys=[...p.tracks].flatMap(k=>T(k).c).filter(k=>!C[k].opt);
    const st=k=>(p.pr||{})[k]||"";
    const done=keys.filter(k=>st(k)==="done").length, ip=keys.filter(k=>st(k)==="prog").length, en=keys.filter(k=>st(k)==="enr").length;
    const exam=p.tracks.map(k=>T(k).cert).filter(Boolean).pop();
    return {p,keys,done,ip,en,exam,examSt:st(exam)};
  });
  const pct=r=>r.keys.length?Math.round(100*r.done/r.keys.length):0;
  const tA=k=>T("A").c.filter(x=>!C[x].opt);
  const aStarted=rows.filter(r=>tA().some(k=>((r.p.pr||{})[k]||"")!=="")).length;
  return `<div class="kicker">Progress</div><h1>Progress against the plan</h1>
  <p class="lede">A high-level view of where each person is on their own plan. Helix refreshes this from Learn@Helix; the last refresh was ${AS_OF}, the day the plan was shared, so most plans have not started yet.</p>
  <div class="grid g4" style="margin-top:14px">
   <div class="card stat"><div class="v">${active.length} / ${PEOPLE.length}</div><div class="l">with full Learn@Helix access</div><div class="s">${reg.length-active.length} access pending · ${PEOPLE.length-reg.length} not registered</div></div>
   <div class="card stat"><div class="v">${aStarted}</div><div class="l">enrolled in or started Track A</div><div class="s">Target: everyone by November 27</div></div>
   <div class="card stat"><div class="v">${rows.reduce((s,r)=>s+r.done,0)}</div><div class="l">plan courses completed</div><div class="s">${rows.reduce((s,r)=>s+r.ip,0)} in progress</div></div>
   <div class="card stat"><div class="v">0</div><div class="l">Associate exams passed</div><div class="s">Closest: CMDB 22.x (Jithendra)</div></div>
  </div>
  <h2>By person</h2>
  <div class="tbl"><table><thead><tr><th>Name</th><th>Learn@Helix</th><th>Plan progress</th><th class="num">Done</th><th class="num">In progress</th><th>Target exam</th><th class="num">Hours logged</th><th>Other progress</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><strong>${esc(r.p.n)}</strong><div class="small muted">${trackTags(r.p)}</div></td><td>${status(r.p)}</td><td style="min-width:140px"><div class="bar" aria-label="${pct(r)}% complete"><i style="width:${Math.max(pct(r),r.ip||r.en?4:0)}%"></i></div><div class="small muted" style="margin-top:4px">${pct(r)}% of ${r.keys.length} core items${r.en?` · ${r.en} enrolled`:""}</div></td><td class="num">${r.done}</td><td class="num">${r.ip}</td><td class="small">${r.exam?esc(C[r.exam].t.replace("BMC Certified Associate: ","").replace(" Online Exam","")):"–"}<div class="muted">${r.examSt==="done"?"Passed":r.examSt?"In progress":"Not started"}</div></td><td class="num">${r.p.hrsLogged!=null?hfmt(r.p.hrsLogged):"–"}</td><td class="small">${esc(OTHER[r.p.n]||"–")}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="small muted">Plan progress counts the core (non-optional) courses and exams in each person's tracks. Hours logged is total time recorded in Learn@Helix, including courses outside the plan.</p>`;
}

  Object.keys(VIEWS).forEach(k=>{const s=document.getElementById("v-"+k);s.classList.toggle("on",k===cur);s.innerHTML=k===cur?VIEWS[k][1]():"";});
  if(cur==="team"){fillTeam();document.getElementById("q").oninput=fillTeam;document.getElementById("fr").onchange=fillTeam;
    document.getElementById("copyTbl").onclick=()=>{try{navigator.clipboard.writeText(tableText()).then(()=>{document.getElementById("copyMsg").textContent="Copied. Paste into column A of the team list.";}).catch(()=>{document.getElementById("copyMsg").textContent="Copy is not available here.";});}catch(e){}};}
  if(cur==="plans"){document.querySelectorAll("#pl button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#pl button").forEach(x=>x.setAttribute("aria-pressed",x===b));document.querySelectorAll(".person").forEach((d,i)=>d.classList.toggle("on",String(i)===b.dataset.i));});}
  document.querySelectorAll(".copy[data-c]").forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.c).then(()=>{b.textContent="Copied";}).catch(()=>{});}catch(e){}});
}
function go(v){cur=v;try{history.replaceState(null,"","#"+v);}catch(e){}render();try{window.scrollTo({top:0});}catch(e){}}
window.addEventListener("hashchange",()=>{try{const h=location.hash.slice(1);if(VIEWS[h]&&h!==cur){cur=h;render();}}catch(e){}});
document.getElementById("themeBtn").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark";};
const PDF=(()=>{try{const m=location.hash.match(/^#pdf-(\d+)$/);return m?+m[1]:null;}catch(e){return null;}})();
if(PDF!==null&&PEOPLE[PDF]){
  document.querySelector("header.mast").style.display="none";
  document.querySelector("footer").style.display="none";
  const p=PEOPLE[PDF];
  const v=document.getElementById("v-plans");v.classList.add("on");
  v.innerHTML=`<div class="kicker">Forteneon Technologies · Helix Partner Success Plan</div><p class="small muted" style="margin:0 0 14px">Individual learning plan · Learn@Helix data as of ${AS_OF} · Prepared by Nikki Sanchez, Partner Success Manager, Helix</p>`+person(p,0).replace('class="person ','class="person on ');
  v.innerHTML+=`<p class="small muted" style="margin-top:18px">Hours are Learn@Helix catalog durations unless marked "About". Associate exams are included for Helix partners. Questions: Nidhi Aggarwal (nidhi.aggarwal@helixops.ai) or Nikki Sanchez (nicole.sanchez@helixops.ai). Full team plan: Forteneon Partner Success Plan & Review.</p>`;
}else render();
</script>
